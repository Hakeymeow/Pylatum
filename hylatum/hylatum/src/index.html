<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>McCabe-Thiele Calculator</title>
  <!-- PLOTLY_JS -->
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; }
    .inputs-row { display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; margin-bottom: 20px; }
    .input-group { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 140px; }
    .input-group label { font-size: 12px; color: #333; text-align: center; }
    .input-group input { width: 80px; padding: 8px; text-align: center; }
    .controls { display: flex; flex-direction: column; gap: 15px; }
    #calculate { width: 100%; padding: 12px; }
    #result { padding: 15px; background: #f0f0f0; display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; }
    .result-item { display: flex; flex-direction: column; align-items: center; gap: 2px; }
    .result-item label { font-size: 12px; color: #666; }
    .result-item span { font-size: 16px; font-weight: bold; }
    #chart { width: 100%; height: auto; aspect-ratio: 1 / 1; margin: 0 auto; }

    /* Interactive mode */
    #mode-toggle {
      padding: 12px; width: 100%; cursor: pointer;
      background: #95a5a6; color: white; border: none; border-radius: 4px;
      font-size: 14px; font-weight: bold; transition: background 0.2s;
    }
    #mode-toggle.active { background: #e67e22; }
    #interactive-badge {
      display: none; padding: 8px 16px; background: #e67e22; color: white;
      border-radius: 4px; font-size: 14px; font-weight: bold; text-align: center; margin-top: 8px;
    }
    #interactive-badge .hint { font-size: 11px; font-weight: normal; opacity: 0.8; }
    .input-group input:disabled { background: #ecf0f1; color: #7f8c8d; cursor: not-allowed; }
  </style>
</head>
<body>
  <h1>McCabe-Thiele Calculator</h1>
  <div class="inputs-row">
    <div class="input-group">
      <label>Reflux Ratio (R)</label>
      <input type="number" id="R" step="0.1" min="0" value="2.0">
    </div>
    <div class="input-group">
      <label>Feed Condition (q)</label>
      <input type="number" id="q" step="0.01" min="-1" max="2" value="1.0">
    </div>
    <div class="input-group">
      <label>Volatility (α)</label>
      <input type="number" id="alpha" step="0.05" min="1.01" value="2.5">
    </div>
    <div class="input-group">
      <label>Distillate (xD)</label>
      <input type="number" id="xD" step="0.01" min="0" max="1" value="0.97">
    </div>
    <div class="input-group">
      <label>Feed (xF)</label>
      <input type="number" id="xF" step="0.01" min="0" max="1" value="0.45">
    </div>
    <div class="input-group">
      <label>Bottoms (xW)</label>
      <input type="number" id="xW" step="0.01" min="0" max="1" value="0.02">
    </div>
    <div class="input-group">
      <label>Interation Limit</label>
      <input type="number" id="inf" step="65536" min="1" value="65536">
    </div>
  </div>
  <div class="controls">
    <button id="calculate">Calculate</button>
    <div id="result"></div>
    <button id="mode-toggle">Interactive</button>
    <div id="interactive-badge"></div>
  </div>
  <div id="chart"></div>
  <script>
    document.getElementById('calculate').addEventListener('click', async () => {
      await doCalculate();
    });

    async function doCalculate() {
      const R = parseFloat(document.getElementById('R').value);
      const q = parseFloat(document.getElementById('q').value);
      const alpha = parseFloat(document.getElementById('alpha').value);
      const xD = parseFloat(document.getElementById('xD').value);
      const xF = parseFloat(document.getElementById('xF').value);
      const xW = parseFloat(document.getElementById('xW').value);
      const inf = parseFloat(document.getElementById('inf').value);
      function fmt(v, decimals) {
        return v === null ? '\u221E' : (decimals != null ? v.toFixed(decimals) : v);
      }
      try {
        const result = await window.pywebview.api.calculate(R, q, alpha, xD, xF, xW, inf);
        document.getElementById('result').innerHTML = `
          <div class="result-item"><label>Minium Reflux (Rm)</label><span>${fmt(result.Rm, 3)}</span></div>
          <div class="result-item"><label>Total Plates (Nt)</label><span>${fmt(result.Nt)}</span></div>
          <div class="result-item"><label>Feed Plate (Nf)</label><span>${fmt(result.Nf)}</span></div>
          <div class="result-item"><label>Rectifying (Nr)</label><span>${fmt(result.Nr)}</span></div>
          <div class="result-item"><label>Stripping (Ns)</label><span>${fmt(result.Ns)}</span></div>
        `;
        const chartData = await window.pywebview.api.plotly_chart(R, q, alpha, xD, xF, xW);
        const layout = { ...chartData.layout, width: undefined, height: undefined };
        Plotly.react('chart', chartData.data, layout, {responsive: true, displayModeBar: true});
      } catch (e) {
        document.getElementById('result').innerHTML = 'Error: ' + e;
      }
    }

    if (window.pywebview && window.pywebview.api) {
      doCalculate();
    } else {
      window.addEventListener('pywebviewready', doCalculate);
    }

    // ===== INTERACTIVE MODE =====
    var isInteractive = false;
    var activeParamIdx = 0;
    var PARAM_NAMES = ['R', 'q', 'alpha'];
    var pendingBridgeCall = false;
    var lastMousePos = null;
    var lastThrottleTime = 0;
    var THROTTLE_MS = 100;

    function getParamLabel(name) {
      return {R:'Reflux Ratio (R)', q:'Feed Condition (q)', alpha:'Volatility (\u03b1)'}[name] || name;
    }

    function updateBadge() {
      var param = PARAM_NAMES[activeParamIdx];
      var val = parseFloat(document.getElementById(param).value);
      document.getElementById('interactive-badge').innerHTML =
        '<span>Active: <strong>' + getParamLabel(param) + '</strong> = ' + (isNaN(val) ? '?' : val.toFixed(4)) + '</span>' +
        '<span class="hint"> &bull; TAB to switch &bull; Move mouse over chart</span>';
    }

    async function doInteractiveUpdate(xm, ym) {
      if (pendingBridgeCall) return;
      pendingBridgeCall = true;
      try {
        var R = parseFloat(document.getElementById('R').value);
        var q = parseFloat(document.getElementById('q').value);
        var alpha = parseFloat(document.getElementById('alpha').value);
        var xD = parseFloat(document.getElementById('xD').value);
        var xF = parseFloat(document.getElementById('xF').value);
        var xW = parseFloat(document.getElementById('xW').value);
        var inf = parseFloat(document.getElementById('inf').value);

        var data = await window.pywebview.api.interactive_chart(
          R, q, alpha, xD, xF, xW, inf, PARAM_NAMES[activeParamIdx], xm, ym
        );

        // Highlight active trace
        var hlMap = {R:2, q:3, alpha:1};
        var hlIdx = hlMap[PARAM_NAMES[activeParamIdx]];
        var traces = data.data.map(function(t, i) {
          var newLine = (t.line || {});
          if (i === hlIdx) newLine.width = 4;
          else if (i !== 0 && i !== 5) newLine.width = 2;
          return { ...t, line: newLine };
        });

        var layout = { ...data.layout, width: undefined, height: undefined };
        await Plotly.react('chart', traces, layout, { responsive: true, displayModeBar: true });

        // Warning annotation for below-minimum reflux
        if (data.result.Rm != null && data.result.Nt === null) {
          Plotly.relayout('chart', { annotations: [{
            x: xm, y: ym+0.1,
            text: '\u26A0 Below min reflux (Rm=' + data.result.Rm.toFixed(4) + ')',
            showarrow: false,
            font: { color: '#d35400', size: 12, family: 'Arial' },
            bgcolor: '#ffeaa7',
            bordercolor: '#d35400',
            borderwidth: 1,
            borderpad: 4,
            opacity: 0.9,
            xref: 'x', yref: 'y',
            xanchor: 'left', yanchor: 'bottom',
            ax: 20, ay: -20
          }]});
        } else {
          Plotly.relayout('chart', { annotations: [] });
        }

        // Re-attach mouse handler after Plotly redraw
        setTimeout(attachMouseHandler, 50);

        // Update badge and input
        var pn = PARAM_NAMES[activeParamIdx];
        var pv = data.params[pn];
        document.getElementById('interactive-badge').innerHTML =
          '<span>Active: <strong>' + getParamLabel(pn) + '</strong> = ' + (pv != null ? pv.toFixed(4) : '?') + '</span>' +
          '<span class="hint"> &bull; TAB to switch &bull; Move mouse over chart</span>';
        document.getElementById(pn).value = pv;

        // Update results
        function fmt(v, d) { return v === null ? '\u221E' : (d != null ? v.toFixed(d) : v); }
        document.getElementById('result').innerHTML =
          '<div class="result-item"><label>Min Reflux (Rm)</label><span>' + fmt(data.result.Rm, 3) + '</span></div>' +
          '<div class="result-item"><label>Total Plates (Nt)</label><span>' + fmt(data.result.Nt) + '</span></div>' +
          '<div class="result-item"><label>Feed Plate (Nf)</label><span>' + fmt(data.result.Nf) + '</span></div>' +
          '<div class="result-item"><label>Rectifying (Nr)</label><span>' + fmt(data.result.Nr) + '</span></div>' +
          '<div class="result-item"><label>Stripping (Ns)</label><span>' + fmt(data.result.Ns) + '</span></div>';
      } catch (e) {
        console.error('Interactive update failed:', e);
      }
      pendingBridgeCall = false;
    }

    function onChartMouseMove(event) {
      if (!isInteractive) return;
      var gd = document.getElementById('chart');
      if (!gd._fullLayout || !gd._fullLayout.xaxis) return;
      var rect = gd.getBoundingClientRect();
      var px = event.clientX - rect.left;
      var py = event.clientY - rect.top;
      var xaxis = gd._fullLayout.xaxis;
      var yaxis = gd._fullLayout.yaxis;
      var xm = xaxis.p2d(px - xaxis._offset);
      var ym = yaxis.p2d(py - yaxis._offset);
      if (xm < 0 || xm > 1 || ym < 0 || ym > 1) return;
      lastMousePos = { x: xm, y: ym };
      var now = Date.now();
      if (now - lastThrottleTime < THROTTLE_MS) return;
      lastThrottleTime = now;
      doInteractiveUpdate(xm, ym);
    }

    function attachMouseHandler() {
      var gd = document.getElementById('chart');
      if (gd) {
        gd.removeEventListener('mousemove', onChartMouseMove);
        gd.addEventListener('mousemove', onChartMouseMove);
      }
    }

    // Toggle button
    document.getElementById('mode-toggle').addEventListener('click', function() {
      isInteractive = !isInteractive;
      this.textContent = isInteractive ? 'Switch to Static' : 'Interactive';
      this.classList.toggle('active', isInteractive);
      document.getElementById('interactive-badge').style.display = isInteractive ? 'block' : 'none';
      var inputs = document.querySelectorAll('.input-group input');
      for (var i = 0; i < inputs.length; i++) { inputs[i].disabled = isInteractive; }
      if (isInteractive) {
        updateBadge();
        attachMouseHandler();
        if (lastMousePos) doInteractiveUpdate(lastMousePos.x, lastMousePos.y);
      }
    });

    // Keyboard controls: TAB to cycle params, ESC to exit interactive mode
    document.addEventListener('keydown', function(e) {
      if (!isInteractive) return;
      if (e.key === 'Escape') {
        document.getElementById('mode-toggle').click();
        return;
      }
      if (e.key !== 'Tab') return;
      e.preventDefault();
      if (e.shiftKey) {
        activeParamIdx = (activeParamIdx - 1 + PARAM_NAMES.length) % PARAM_NAMES.length;
      } else {
        activeParamIdx = (activeParamIdx + 1) % PARAM_NAMES.length;
      }
      updateBadge();
      if (lastMousePos) doInteractiveUpdate(lastMousePos.x, lastMousePos.y);
    });

    // Attach mouse handler after page loads
    setTimeout(attachMouseHandler, 500);
  </script>
</body>
</html>
