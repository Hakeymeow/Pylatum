[project]
name = "pylatum"
version = "0.1.0"
description = "A learning project for calculating the number of theoretical plates in distillation columns"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[project.scripts]
hy-cli = "hybrid.src.calc:main"
hy-gui = "hybrid.src.calc_gui:main"
hy-build = "hybrid.src.build:main"
hy-render = "hybrid.src.demo:main"

[[tool.uv.index]]
url = "https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple/"
default = true

[tool.uv.workspace]
members = [
    "hybrid",
]
